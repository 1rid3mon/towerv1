<!doctype html><html lang="tr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>LOST SIGNAL · Uyanış</title>
<style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050c16;color:#d9f5ff;font:15px system-ui;touch-action:none}canvas{display:block;width:100%;height:100%;touch-action:none}#hud{position:fixed;top:12px;left:12px;right:12px;pointer-events:none;display:flex;justify-content:space-between;gap:10px}#status{max-width:520px;background:#071522e8;border:1px solid #397a90;border-radius:12px;padding:12px;font-size:13px}#close{pointer-events:auto;background:#14263b;border:1px solid #6ba9c4;color:white;border-radius:10px;padding:10px 14px}#pad{position:fixed;bottom:22px;left:24px;width:126px;height:126px;border-radius:50%;border:2px solid #438da3;background:#12384a66;touch-action:none}#knob{position:absolute;left:41px;top:41px;width:42px;height:42px;border-radius:50%;background:#58d4e9aa;border:2px solid #b4f8ff}#act{position:fixed;right:24px;bottom:35px;border-radius:50%;width:100px;height:100px;border:2px solid #b9f1ff;background:#155e73;color:white;font-weight:800}#modal{position:fixed;inset:0;background:#020811d9;display:none;align-items:center;justify-content:center;padding:18px}#modal.open{display:flex}#panel{width:min(500px,100%);background:#0c2133;border:1px solid #54bed0;border-radius:18px;padding:24px}#panel button{background:#143f55;color:#ecfcff;border:1px solid #55b6cc;border-radius:9px;padding:13px;margin:6px;font-size:16px}#panel button.active{background:#286f4e;border-color:#9cffb9}#panel p{line-height:1.6;color:#bdd8e7}#tip{position:fixed;bottom:10px;left:50%;transform:translateX(-50%);font-size:11px;color:#b2d8e5;pointer-events:none}@media(max-width:650px){#hud{top:5px;left:5px;right:5px}#status{font-size:11px;padding:8px;max-width:76%}#pad{bottom:20px;left:12px}#act{right:12px;bottom:25px}#tip{display:none}}</style>
<canvas id="world"></canvas><div id="hud"><div id="status" aria-live="polite"></div><button id="close">ÇIKIŞ</button></div><div id="pad"><div id="knob"></div></div><button id="act">ETKİLEŞ</button><div id="tip">WASD / ok tuşları · E etkileşim · Dokunmatik joystick</div><div id="modal"><div id="panel"></div></div>
<script>
(()=>{'use strict';
const canvas=document.getElementById('world'),ctx=canvas.getContext('2d'),status=document.getElementById('status'),modal=document.getElementById('modal'),panel=document.getElementById('panel');
let W=innerWidth,H=innerHeight,dpr=1,last=0,phase=0,done=false,dialog=false;const inspectedLogs=new Set();const p={x:170,y:240,r:13},keys=new Set(),joy={x:0,y:0,id:null},fuses=[false,false,false],enemies=[{x:815,y:120,hp:3},{x:855,y:235,hp:3},{x:815,y:345,hp:3}],turret={x:650,y:240},base={hp:12},world={w:1000,h:500};
const stations=[{x:240,y:115,label:'KONSOL',kind:'console'},{x:130,y:400,label:'BAKIM DEFTERİ',kind:'log'},{x:345,y:400,label:'DEVRE PLANI',kind:'log'},{x:450,y:240,label:'KAPI',kind:'door'},{x:675,y:240,label:'SAVUNMA',kind:'defense'}];
function resize(){W=innerWidth;H=innerHeight;dpr=Math.min(devicePixelRatio||1,2);canvas.width=W*dpr;canvas.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();
function hud(){status.innerHTML='<strong>LOST SIGNAL · GÖREV 01 — UYANIŞ</strong><div style="margin-top:5px">'+(['Enerji konsoluna git ve E / ETKİLEŞ ile aç.','Üç enerji hattını doğru sırayla bağla.','Açılan kapıdan savunma bölümüne ilerle.','Savunma terminaline ulaş.','Savunma modunda düşmanlara dokunarak kuleyi hedefle.','İstasyon güvende. Görevi tamamla.'][phase]||'')+'</div>'+(phase===4?'<div>Reaktör dayanıklılığı: '+base.hp+' · Kalan tehdit: '+enemies.filter(e=>e.hp>0).length+'</div>':'')}hud();
function show(content){dialog=true;modal.classList.add('open');panel.innerHTML=content}function hide(){dialog=false;modal.classList.remove('open')}
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
function near(s){return dist(p,s)<80}
function interact(){if(dialog||done)return;const log=stations.find(s=>s.kind==='log'&&near(s));if(log&&phase<3){inspectedLogs.add(log.label);hud();messageLog(log);return}if((phase===0||phase===1)&&near(stations[0])){if(inspectedLogs.size<2){show('<h2>EKSİK ŞEMA</h2><p>Sigortaların sırasını bilmiyorsun. Odadaki <b>Bakım Defteri</b> ile <b>Devre Planı</b> belgelerini fiziksel olarak bulup incele.</p><button id="ok">DEVAM</button>');document.getElementById('ok').onclick=hide;return}phase=1;hud();show('<h2>ENERJİ DAĞITIMI</h2><p>İki kayıtta bulduğun sırayı kullan. Yanlış bağlantı güvenlik kilidini sıfırlar.</p><div id="fuse"></div><p id="feedback"></p><button id="leave">KAPAT</button>');document.getElementById('leave').onclick=hide;drawFuse();return}if(phase===2&&near(stations.find(s=>s.kind==='door'))){phase=3;hud();show('<h2>GÜVENLİK KAPISI</h2><p>Enerji yönlendirildi. Kapı açıldı. Koridorda ilerle.</p><button id="ok">DEVAM</button>');document.getElementById('ok').onclick=hide;return}if(phase===3&&near(stations.find(s=>s.kind==='defense'))){phase=4;hud();show('<h2>ALARM · SAVUNMA</h2><p>Üç saldırgan yaklaşıyor. Kuleyi yönetmek için düşmanların üzerine dokun veya tıkla. Her hedef üç isabetle etkisizleşir. Düşmanlar reaktöre ulaşmadan durdur!</p><button id="ok">SAVUNMAYA GEÇ</button>');document.getElementById('ok').onclick=hide;return}if(phase===5&&near(stations.find(s=>s.kind==='defense')))finish()}
function messageLog(log){show('<h2>'+log.label+'</h2><p>'+(log.label==='BAKIM DEFTERİ'?'Arıza raporu: Reaktör hattı her zaman ilk sırada etkinleştirilmelidir. Güvenlik bağlantısı en son yapılır.':'Devre planı: Soğutma, reaktörden sonra ve güvenlikten önce bağlanmalıdır.')+'</p><button id="ok">DEVAM</button>');document.getElementById('ok').onclick=hide}
function drawFuse(){const box=document.getElementById('fuse');if(!box)return;box.innerHTML=['REAKTÖR','SOĞUTMA','GÜVENLİK'].map((n,i)=>'<button data-i="'+i+'" class="'+(fuses[i]?'active':'')+'">'+n+' '+(fuses[i]?'✓':'○')+'</button>').join('');box.querySelectorAll('button').forEach(b=>b.onclick=()=>{const i=+b.dataset.i,expected=fuses.indexOf(false);if(i!==expected){document.getElementById('feedback').textContent='Yanlış bağlantı. Güvenlik sistemi devreyi sıfırladı.';fuses.fill(false)}else fuses[i]=true;drawFuse();if(fuses.every(Boolean)){phase=2;hud();show('<h2>ENERJİ GERİ GELDİ</h2><p>Kapı kilidi açıldı. Artık koridora geçebilirsin.</p><button id="ok">DEVAM</button>');document.getElementById('ok').onclick=hide}})}
function finish(){done=true;show('<h2>GÖREV 01 TAMAMLANDI</h2><p>İstasyon enerjisi geri geldi. İlk saldırı durduruldu. Bir sonraki bölüm bu istasyonun devamında başlayacak.</p><button id="complete">GÖREV PANOSUNA DÖN</button>');document.getElementById('complete').onclick=()=>{parent.postMessage({type:'lost-signal-interior-mission-complete',mission:1},location.origin)}}
function fail(){phase=3;enemies=[{x:815,y:120,hp:3},{x:855,y:235,hp:3},{x:815,y:345,hp:3}];base.hp=12;p.x=540;p.y=240;hud();show('<h2>SAVUNMA ÇÖKTÜ</h2><p>Reaktör hasar aldı. Savunmayı yeniden dene.</p><button id="retry">TEKRAR DENE</button>');document.getElementById('retry').onclick=hide}
function move(dt){if(dialog)return;let dx=(keys.has('d')||keys.has('arrowright')?1:0)-(keys.has('a')||keys.has('arrowleft')?1:0)+joy.x,dy=(keys.has('s')||keys.has('arrowdown')?1:0)-(keys.has('w')||keys.has('arrowup')?1:0)+joy.y;const mag=Math.hypot(dx,dy)||1;let nx=Math.max(35,Math.min(world.w-35,p.x+dx/mag*210*dt)),ny=Math.max(45,Math.min(world.h-45,p.y+dy/mag*210*dt));const crossing=(p.x<=470&&nx>470)||(p.x>=470&&nx<470);if(crossing&&(phase<3||ny<182||ny>298))nx=p.x;if(phase<3&&p.x<450&&nx>450)nx=450;if(phase<3&&p.x>450&&nx<450)nx=450;p.x=nx;p.y=ny}
function draw(){ctx.fillStyle='#06101b';ctx.fillRect(0,0,W,H);const scale=Math.min(W/650,H/380,1.5),camX=Math.max(0,Math.min(world.w-W/scale,p.x-W/scale/2)),camY=Math.max(0,Math.min(world.h-H/scale,p.y-H/scale/2));ctx.save();ctx.scale(scale,scale);ctx.translate(-camX,-camY);ctx.fillStyle='#101f2b';ctx.fillRect(25,25,world.w-50,world.h-50);ctx.strokeStyle='#254154';ctx.lineWidth=2;for(let x=25;x<world.w;x+=50){ctx.beginPath();ctx.moveTo(x,25);ctx.lineTo(x,475);ctx.stroke()}for(let y=25;y<world.h;y+=50){ctx.beginPath();ctx.moveTo(25,y);ctx.lineTo(975,y);ctx.stroke()}ctx.strokeStyle='#7ca4b5';ctx.lineWidth=10;ctx.strokeRect(25,25,950,450);ctx.beginPath();ctx.moveTo(470,25);ctx.lineTo(470,185);ctx.moveTo(470,295);ctx.lineTo(470,475);ctx.stroke();if(phase<3){ctx.strokeStyle='#ff8e73';ctx.lineWidth=14;ctx.beginPath();ctx.moveTo(470,185);ctx.lineTo(470,295);ctx.stroke()}for(const s of stations){ctx.fillStyle=s.kind==='console'?'#196d79':s.kind==='door'?'#775a38':'#6c4c81';ctx.fillRect(s.x-23,s.y-20,46,40);ctx.strokeStyle='#b8f3ff';ctx.strokeRect(s.x-23,s.y-20,46,40);ctx.fillStyle='#d6f7ff';ctx.font='12px system-ui';ctx.textAlign='center';ctx.fillText(s.label,s.x,s.y-28)}ctx.fillStyle='#6ce2f6';ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();ctx.fillStyle='#061a26';ctx.fillRect(p.x-5,p.y-5,10,10);if(phase>=4){ctx.fillStyle='#f0bd6c';ctx.beginPath();ctx.arc(turret.x,turret.y,18,0,Math.PI*2);ctx.fill();for(const e of enemies.filter(e=>e.hp>0)){ctx.fillStyle='#e67582';ctx.fillRect(e.x-13,e.y-13,26,26);ctx.fillStyle='#fff';ctx.font='12px system-ui';ctx.fillText('♥'.repeat(e.hp),e.x,e.y-22)}}ctx.restore()}
let attack=0;function tick(t){const dt=Math.min((t-last)/1000||0,0.04);last=t;move(dt);if(phase===4&&!dialog){attack+=dt;if(attack>2.2){attack=0;const e=enemies.find(e=>e.hp>0);if(e){base.hp-=2;hud();if(base.hp<=0)fail()}}}draw();requestAnimationFrame(tick)}requestAnimationFrame(tick);
canvas.addEventListener('pointerdown',e=>{if(phase!==4||dialog)return;const scale=Math.min(W/650,H/380,1.5),camX=Math.max(0,Math.min(world.w-W/scale,p.x-W/scale/2)),camY=Math.max(0,Math.min(world.h-H/scale,p.y-H/scale/2));const x=e.clientX/scale+camX,y=e.clientY/scale+camY;const target=enemies.find(z=>z.hp>0&&Math.hypot(z.x-x,z.y-y)<36);if(target){target.hp--;if(enemies.every(z=>z.hp<=0)){phase=5;hud();show('<h2>TEHDİT DURDURULDU</h2><p>Savunma başarılı. Son durumu onaylamak için savunma terminaline yaklaş.</p><button id="ok">DEVAM</button>');document.getElementById('ok').onclick=hide}}});
addEventListener('keydown',e=>{const k=e.key.toLowerCase();keys.add(k);if(['arrowup','arrowdown','arrowleft','arrowright',' '].includes(k))e.preventDefault();if(k==='e'||k===' ')interact()});addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));document.getElementById('act').onclick=interact;document.getElementById('close').onclick=()=>parent.postMessage({type:'lost-signal-interior-close'},location.origin);
const pad=document.getElementById('pad'),knob=document.getElementById('knob');function stick(e){const b=pad.getBoundingClientRect(),x=e.clientX-(b.left+b.width/2),y=e.clientY-(b.top+b.height/2),m=Math.max(1,Math.hypot(x,y)),f=Math.min(m/44,1);joy.x=x/m*f;joy.y=y/m*f;knob.style.transform='translate('+(joy.x*37)+'px,'+(joy.y*37)+'px)'}pad.addEventListener('pointerdown',e=>{joy.id=e.pointerId;pad.setPointerCapture(e.pointerId);stick(e)});pad.addEventListener('pointermove',e=>{if(e.pointerId===joy.id)stick(e)});function reset(e){if(e.pointerId!==joy.id)return;joy.id=null;joy.x=joy.y=0;knob.style.transform=''}pad.addEventListener('pointerup',reset);pad.addEventListener('pointercancel',reset);
})();
</script></html>
