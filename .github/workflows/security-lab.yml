name: Security lab tests

on:
  pull_request:
    paths:
      - "security-lab/**"
      - "firestore.rules"
      - "firebase.json"
      - "DATA_STORAGE_ARCHITECTURE.md"
      - ".github/workflows/security-lab.yml"
      - "ui.js"
      - "story.js"
      - "story-finale.js"
      - "locales.js"
      - "i18n.js"
      - "mode-runtime.js"
      - "index.html"
      - "engine.js"
      - "render.js"
      - "data.js"
      - "*.css"
      - "*signal*.js"
      - "*v9.js"
      - "*v10.js"
      - "*v11.js"
      - "enemy-*.js"
      - "living-space.js"
      - "theme-atmosphere.js"
      - "command-sounds.js"
  push:
    branches:
      - main
      - security-hardening-review
      - "feature/**"
      - "release/**"
    paths:
      - "security-lab/**"
      - "firestore.rules"
      - "firebase.json"
      - "DATA_STORAGE_ARCHITECTURE.md"
      - ".github/workflows/security-lab.yml"
      - "ui.js"
      - "story.js"
      - "story-finale.js"
      - "locales.js"
      - "i18n.js"
      - "mode-runtime.js"
      - "index.html"
      - "engine.js"
      - "render.js"
      - "data.js"
      - "*.css"
      - "*signal*.js"
      - "*v9.js"
      - "*v10.js"
      - "*v11.js"
      - "enemy-*.js"
      - "living-space.js"
      - "theme-atmosphere.js"
      - "command-sounds.js"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  firestore-emulator-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java for Firestore Emulator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Check JavaScript syntax
        run: |
          node --check ui.js
          node --check mode-runtime.js
          node --check story.js
          node --check story-finale.js
          node --check locales.js
          node --check i18n.js
          node --check engine.js
          node --check render.js
          for file in *.js; do node --check "$file"; done

      - name: Verify V12 bounded visual feedback
        run: node security-lab/combat-v12.test.cjs

      - name: Verify V12 four-system console
        run: node security-lab/four-systems-v12.test.cjs
      - name: Verify V13 cosmetic quarters and story save isolation
        run: node security-lab/commanders-quarters-v13.test.cjs
      - name: Verify V12 boss phases, combos and narrative branching
        run: node security-lab/v12-expansion.test.cjs

      - name: Install security lab dependencies
        working-directory: security-lab
        run: npm install --no-audit --no-fund

      - name: Run Firestore Rules tests in local emulator
        working-directory: security-lab
        run: npm test

  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install test dependencies
        working-directory: security-lab
        run: npm install --no-audit --no-fund
      - name: Install Chromium
        working-directory: security-lab
        run: npx playwright install --with-deps chromium
      - name: Verify V12 combat in desktop and mobile Chromium
        working-directory: security-lab
        run: node v12-browser.cjs
      - name: Test Story in desktop and mobile Chromium
        working-directory: security-lab
        run: node browser-smoke.cjs
      - name: Play all 27 campaign missions and switch all four languages
        working-directory: security-lab
        run: node campaign-browser.cjs
      - name: Test the matching live production assets with a disposable guest
        if: github.ref == 'refs/heads/main'
        working-directory: security-lab
        run: node browser-smoke.cjs --live
      - name: Preserve guest-only browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-smoke-evidence
          path: security-lab/browser-evidence/
          if-no-files-found: ignore

  webkit-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BROWSER_ENGINE: webkit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install test dependencies
        working-directory: security-lab
        run: npm install --no-audit --no-fund
      - name: Install WebKit
        working-directory: security-lab
        run: npx playwright install --with-deps webkit
      - name: Verify V12 combat in WebKit tablet and mobile
        working-directory: security-lab
        run: node v12-browser.cjs
      - name: Test Story phone, landscape, tablet and desktop in WebKit
        working-directory: security-lab
        run: node browser-smoke.cjs
      - name: Test matching production assets and flows in WebKit
        if: github.ref == 'refs/heads/main'
        working-directory: security-lab
        run: node browser-smoke.cjs --live
      - name: Preserve WebKit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: webkit-smoke-evidence
          path: security-lab/browser-evidence/
          if-no-files-found: ignore

  overhaul-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    env:
      BROWSER_ENGINE: ${{ matrix.engine }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install test dependencies
        working-directory: security-lab
        run: npm install --no-audit --no-fund
      - name: Install browser
        working-directory: security-lab
        run: npx playwright install --with-deps ${{ matrix.engine }}
      - name: Test exploration, modules, evolution and saves
        working-directory: security-lab
        run: node overhaul-browser.cjs
      - name: Test matching production sources and actual exploration
        if: github.ref == 'refs/heads/main'
        working-directory: security-lab
        run: node overhaul-browser.cjs --live
      - name: Preserve exploration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: overhaul-${{ matrix.engine }}-evidence
          path: security-lab/browser-evidence/
          if-no-files-found: ignore
