name: Security lab tests

on:
  pull_request:
    paths:
      - "security-lab/**"
      - "firestore.rules"
      - "firebase.json"
      - "DATA_STORAGE_ARCHITECTURE.md"
      - ".github/workflows/security-lab.yml"
      - "ui.js"
      - "story.js"
      - "mode-runtime.js"
      - "index.html"
      - "engine.js"
      - "render.js"
      - "data.js"
  push:
    branches:
      - main
      - security-hardening-review
      - "feature/**"
      - "release/**"
    paths:
      - "security-lab/**"
      - "firestore.rules"
      - "firebase.json"
      - "DATA_STORAGE_ARCHITECTURE.md"
      - ".github/workflows/security-lab.yml"
      - "ui.js"
      - "story.js"
      - "mode-runtime.js"
      - "index.html"
      - "engine.js"
      - "render.js"
      - "data.js"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  firestore-emulator-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java for Firestore Emulator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Check JavaScript syntax
        run: |
          node --check ui.js
          node --check mode-runtime.js
          node --check story.js
          node --check engine.js
          node --check render.js
          node --check data.js

      - name: Install security lab dependencies
        working-directory: security-lab
        run: npm install --no-audit --no-fund

      - name: Run Firestore Rules tests in local emulator
        working-directory: security-lab
        run: npm test

  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install test dependencies
        working-directory: security-lab
        run: npm install --no-audit --no-fund
      - name: Install Chromium
        working-directory: security-lab
        run: npx playwright install --with-deps chromium
      - name: Test Story in desktop and mobile Chromium
        working-directory: security-lab
        run: node browser-smoke.cjs
      - name: Test the matching live production assets with a disposable guest
        if: github.ref == 'refs/heads/main'
        working-directory: security-lab
        run: node browser-smoke.cjs --live
      - name: Preserve guest-only browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-smoke-evidence
          path: security-lab/browser-evidence/
          if-no-files-found: ignore
