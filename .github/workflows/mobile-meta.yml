name: Mobile meta acceptance
on:
  pull_request:
    paths: ['meta-*.js', 'meta-*.css', 'signal-settings.*', 'fx-director.js', 'data/fx-config.js', 'data/meta-*.js', 'endless-operations.js', 'security-lab/meta-*', '.github/workflows/mobile-meta.yml']
  workflow_dispatch:
jobs:
  mobile-meta:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
        working-directory: security-lab
      - run: npx playwright install --with-deps chromium
        working-directory: security-lab
      - run: node --test security-lab/meta-model.test.js security-lab/meta-radio.test.cjs security-lab/meta-fx-preferences.test.cjs security-lab/fx-director.test.cjs security-lab/endless-operations.test.js
      - run: node security-lab/meta-ui-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-meta-evidence
          path: security-lab/browser-evidence/meta
