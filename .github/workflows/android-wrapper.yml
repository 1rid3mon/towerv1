name: Android wrapper build

on:
  pull_request:
    paths:
      - "android-wrapper/**"
      - "index.html"
      - "engine.js"
      - "render.js"
      - "ui.js"
      - "data.js"
      - ".github/workflows/android-wrapper.yml"
  push:
    branches:
      - security-hardening-review
    paths:
      - "android-wrapper/**"
      - "index.html"
      - "engine.js"
      - "render.js"
      - "ui.js"
      - "data.js"
      - ".github/workflows/android-wrapper.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  assemble-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Build debug APK
        run: gradle -p android-wrapper :app:assembleDebug
